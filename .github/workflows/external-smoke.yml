name: external-smoke
on:
  push:
    branches: [external-smoke]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest   # GitHub-hosted standard runner, free for public repos
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx -y playwright@1.56.1 install --with-deps chromium webkit
      - run: npm i -E playwright@1.56.1
      - run: node scripts/external-smoke.mjs
        env: { SMOKE_OUT: smoke-out }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: external-smoke, path: smoke-out/, if-no-files-found: error }
